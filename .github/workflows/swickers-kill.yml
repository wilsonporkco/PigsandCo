name: Swickers Kill Data Fetch

on:
  workflow_dispatch:
    inputs:
      kill_date:
        description: 'Kill date to fetch (YYYY-MM-DD). Leave blank for today (Brisbane time).'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run fetch
        env:
          PIGSCO_SUPABASE_SERVICE_KEY: ${{ secrets.PIGSCO_SUPABASE_SERVICE_KEY }}
          KILL_DATE: ${{ github.event.inputs.kill_date }}
        run: node swickers-kill.js
